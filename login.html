<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | ReWear AI</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #edf8f0,
                    #dff1e6
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #17382c;

        }


        /* MAIN CONTAINER */

        .container {

            width: 900px;

            min-height: 540px;

            background: white;

            border-radius: 22px;

            overflow: hidden;

            display: grid;

            grid-template-columns: 1fr 1fr;

            box-shadow:
                0 25px 70px
                rgba(30, 80, 55, 0.15);

        }


        /* LEFT SIDE */

        .left {

            background:
                linear-gradient(
                    145deg,
                    #1c6549,
                    #2b8c64
                );

            color: white;

            padding: 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        .logo {

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 70px;

        }


        .logo span {

            color: #c8ead5;

        }


        .left h1 {

            font-size: 43px;

            line-height: 1.15;

            margin-bottom: 20px;

        }


        .left h1 span {

            color: #bfe6cc;

        }


        .left p {

            color: #d8eee1;

            line-height: 1.7;

            font-size: 15px;

        }


        .eco {

            margin-top: 35px;

            font-size: 45px;

        }


        /* RIGHT SIDE */

        .right {

            padding: 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        .right h2 {

            font-size: 32px;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #718179;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* FORM */

        form {

            display: flex;

            flex-direction: column;

            gap: 17px;

        }


        label {

            font-size: 13px;

            font-weight: 600;

            margin-bottom: -10px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d3e1d8;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color: #2b8c64;

            box-shadow:
                0 0 0 3px
                rgba(43, 140, 100, 0.1);

        }


        .password-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .forgot {

            color: #2b8c64;

            font-size: 12px;

            text-decoration: none;

        }


        .login {

            background: #23865c;

            color: white;

            border: none;

            border-radius: 8px;

            padding: 14px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 8px;

        }


        .login:hover {

            background: #1c704d;

        }


        /* DIVIDER */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: #9aa9a1;

            font-size: 12px;

        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background: #e2ebe5;

            flex: 1;

        }


        /* GOOGLE */

        .google {

            width: 100%;

            padding: 12px;

            border: 1px solid #d4e1d8;

            background: white;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            color: #40564c;

        }


        /* SIGN UP */

        .signup {

            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #718179;

        }


        .signup a {

            color: #23865c;

            font-weight: 600;

            text-decoration: none;

        }


        /* MOBILE */

        @media(max-width: 750px) {

            .container {

                width: 95%;

                grid-template-columns: 1fr;

            }


            .left {

                display: none;

            }


            .right {

                padding: 40px 30px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- LEFT -->

    <div class="left">

        <div class="logo">

            rewear<span>.ai</span>

        </div>


        <h1>

            Fashion

            <br>

            <span>deserves</span>

            <br>

            another life.

        </h1>


        <p>

            Join a community that believes
            great clothes should never go to waste.

        </p>


        <div class="eco">

            ♻️ 🌱 👕 🤝

        </div>

    </div>



    <!-- RIGHT -->

    <div class="right">


        <h2>
            Welcome back
        </h2>


        <p class="subtitle">

            Login to continue to ReWear AI

        </p>


        <form
            onsubmit="loginUser(event)"
        >


            <label>
                Email address
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <div class="password-row">

                <label>
                    Password
                </label>

                <a
                    href="#"
                    class="forgot"
                    onclick="forgotPassword()"
                >
                    Forgot password?
                </a>

            </div>


            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="login"
            >
                Login
            </button>


        </form>


        <div class="divider">
            OR
        </div>


        <button
            class="google"
            onclick="googleLogin()"
        >
            G &nbsp; Continue with Google
        </button>


        <p class="signup">

            Don't have an account?

            <a
                href="signup.html"
            >
                Create an account
            </a>

        </p>


    </div>

</div>



<script>
  const form = document.querySelector("form");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = form.querySelector('input[type="email"]').value;
    const password = form.querySelector('input[type="password"]').value;

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      });

      const data = await response.json();

      if (response.ok) {
        alert("Login successful! Welcome to ReWear AI.");
        window.location.href = "index.html";
      } else {
        alert(data.message || "Invalid email or password.");
      }

    } catch (error) {
      console.error(error);
      alert("Could not connect to the server.");
    }
  });
</script>

</body>

</html>
