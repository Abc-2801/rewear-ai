<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages | ReWear AI</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3faf6;
      color: #173b2f;
    }

    /* HEADER */

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #21865f;
    }

    .header-links a {
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
    }

    .home {
      color: #21865f;
    }

    .profile {
      background: #21865f;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
    }


    /* PAGE */

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 35px auto;
    }

    .page-title {
      margin-bottom: 20px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .page-title p {
      color: #777;
    }


    /* CHAT */

    .chat-container {
      height: 650px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 330px 1fr;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }


    /* SIDEBAR */

    .sidebar {
      border-right: 1px solid #e5eee9;
      overflow-y: auto;
    }

    .sidebar-title {
      padding: 20px;
      font-size: 19px;
      font-weight: bold;
      border-bottom: 1px solid #e5eee9;
    }

    .conversation {
      padding: 17px 20px;
      border-bottom: 1px solid #edf2ef;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .conversation:hover {
      background: #f5faf7;
    }

    .conversation.active {
      background: #e6f5ed;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #dff2e7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .conversation-info {
      overflow: hidden;
    }

    .conversation-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .last-message {
      font-size: 13px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* CHAT AREA */

    .chat-area {
      display: flex;
      flex-direction: column;
    }

    .chat-top {
      padding: 18px 22px;
      border-bottom: 1px solid #e5eee9;
      font-weight: bold;
      font-size: 18px;
    }

    .chat-top small {
      display: block;
      font-size: 12px;
      color: #888;
      font-weight: normal;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      background: #f8fcfa;
    }

    .empty-chat {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #888;
    }

    .message {
      max-width: 65%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .sent {
      margin-left: auto;
      background: #21865f;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .received {
      background: #e3f1ea;
      color: #173b2f;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.7;
    }


    /* INPUT */

    .message-form {
      display: flex;
      gap: 10px;
      padding: 17px;
      border-top: 1px solid #e5eee9;
      background: white;
    }

    .message-input {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #d6e4dc;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .send-btn {
      border: none;
      background: #21865f;
      color: white;
      padding: 0 25px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #176d4b;
    }


    /* MOBILE */

    @media (max-width: 750px) {

      .chat-container {
        grid-template-columns: 1fr;
        height: auto;
      }

      .sidebar {
        height: 250px;
        border-right: none;
        border-bottom: 1px solid #e5eee9;
      }

      .chat-area {
        height: 500px;
      }

    }

  </style>

</head>


<body>


<!-- HEADER -->

<header>

  <div class="logo">
    ReWear AI
  </div>

  <div class="header-links">

    <a
      href="index.html"
      class="home">

      Home

    </a>

    <a
      href="profile.html"
      class="profile">

      Profile

    </a>

  </div>

</header>


<div class="container">


  <div class="page-title">

    <h1>
      Messages 💬
    </h1>

    <p>
      Connect with buyers and sellers on ReWear.
    </p>

  </div>


  <div class="chat-container">


    <!-- CONVERSATIONS -->

    <div class="sidebar">

      <div class="sidebar-title">
        Conversations
      </div>

      <div id="conversations">

        <div class="empty-chat">
          Loading...
        </div>

      </div>

    </div>


    <!-- CHAT -->

    <div class="chat-area">


      <div class="chat-top">

        <span id="chat-name">
          Select a conversation
        </span>

        <small id="chat-status">
          Choose someone from the left.
        </small>

      </div>


      <div
        class="messages"
        id="messages">

        <div class="empty-chat">

          <div>

            <div style="font-size:45px;">
              💬
            </div>

            <p>
              Select a conversation to start chatting.
            </p>

          </div>

        </div>

      </div>


      <form
        class="message-form"
        id="message-form">

        <input
          type="text"
          id="message-input"
          class="message-input"
          placeholder="Type a message..."
          required>

        <button
          type="submit"
          class="send-btn">

          Send

        </button>

      </form>

    </div>

  </div>

</div>


<script>

let currentUser = null;

let selectedUserId = null;


/* =========================
   GET CURRENT USER
========================= */

async function getCurrentUser() {

  const response =
    await fetch("/api/me");

  const data =
    await response.json();


  if (!data.loggedIn) {

    window.location.href =
      "login.html";

    return false;

  }


  currentUser =
    data.user;

  return true;

}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations() {

  const response =
    await fetch("/api/conversations");

  const data =
    await response.json();


  const container =
    document.getElementById(
      "conversations"
    );


  if (
    !data.conversations ||
    data.conversations.length === 0
  ) {

    container.innerHTML = `

      <div
        style="
          padding:30px 20px;
          text-align:center;
          color:#888;
        "
      >

        <div style="font-size:40px;">
          💬
        </div>

        <p>
          No conversations yet.
        </p>

        <small>
          Start chatting with a seller.
        </small>

      </div>

    `;

    return;

  }


  container.innerHTML =
    data.conversations.map(user => `

      <div
        class="conversation"
        onclick="openChat(${user.id}, '${escapeName(user.name)}')"
      >

        <div class="avatar">
          👤
        </div>

        <div class="conversation-info">

          <div class="conversation-name">
            ${user.name}
          </div>

          <div class="last-message">
            ${user.last_message || "No messages"}
          </div>

        </div>

      </div>

    `).join("");

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(userId, userName) {

  selectedUserId =
    userId;


  document.getElementById(
    "chat-name"
  ).textContent =
    userName;


  document.getElementById(
    "chat-status"
  ).textContent =
    "ReWear community member";


  await loadMessages();


  document
    .getElementById("message-input")
    .focus();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

  if (!selectedUserId) {
    return;
  }


  const response =
    await fetch(
      "/api/messages/" +
      selectedUserId
    );


  const data =
    await response.json();


  const container =
    document.getElementById(
      "messages"
    );


  if (
    !data.messages ||
    data.messages.length === 0
  ) {

    container.innerHTML = `

      <div class="empty-chat">

        <div>

          <div style="font-size:45px;">
            👋
          </div>

          <p>
            No messages yet.
          </p>

          <small>
            Send the first message!
          </small>

        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    data.messages.map(message => `

      <div class="message ${
        message.sender_id == currentUser.id
          ? "sent"
          : "received"
      }">

        ${message.message}

        <span class="message-time">
          ${message.created_at}
        </span>

      </div>

    `).join("");


  container.scrollTop =
    container.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

document
  .getElementById("message-form")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!selectedUserId) {

        alert(
          "Please select a conversation first."
        );

        return;

      }


      const input =
        document.getElementById(
          "message-input"
        );


      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      const response =
        await fetch(
          "/api/messages",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              receiverId:
                selectedUserId,

              message:
                message

            })

          }
        );


      if (response.ok) {

        input.value = "";

        await loadMessages();

        await loadConversations();

      }

      else {

        alert(
          "Could not send message."
        );

      }

    }
  );


/* =========================
   ESCAPE NAME
========================= */

function escapeName(name) {

  return name
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");

}


/* =========================
   START
========================= */

async function start() {

  const loggedIn =
    await getCurrentUser();


  if (!loggedIn) {
    return;
  }


  await loadConversations();


  // Check if a seller was selected from the Home page
  const urlParams =
    new URLSearchParams(window.location.search);

  const sellerId =
    urlParams.get("user");


  if (sellerId) {

    const response =
      await fetch("/api/user/" + sellerId);

    const data =
      await response.json();


    if (data.user) {

      await openChat(
        data.user.id,
        data.user.name
      );

    }

  }

}

start();

</script>


</body>

</html>
