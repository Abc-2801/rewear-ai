<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sell Clothing | ReWear AI</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3faf6;
      color: #173b2f;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #21865f;
    }

    .home-btn {
      text-decoration: none;
      color: #21865f;
      font-weight: 600;
      margin-right: 20px;
    }

    .profile-btn {
      text-decoration: none;
      background: #21865f;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .container {
      width: 90%;
      max-width: 850px;
      margin: 45px auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9e5df;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #21865f;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .image-box {
      border: 2px dashed #b8d8c8;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      background: #f8fcfa;
      margin-bottom: 25px;
    }

    .image-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .image-box p {
      color: #777;
      margin-bottom: 15px;
    }

    .image-box input {
      border: none;
      background: white;
    }

    .ai-box {
      background: #e9f7ef;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .ai-box strong {
      color: #21865f;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #21865f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #176d4b;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 650px) {

      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 25px;
      }

    }

  </style>

</head>


<body>

  <header>

    <div class="logo">
      ReWear AI
    </div>

    <div>

      <a href="index.html" class="home-btn">
        Home
      </a>

      <a href="profile.html" class="profile-btn">
        My Profile
      </a>

    </div>

  </header>


  <div class="container">

    <div class="card">

      <h1>Sell Your Clothing 👕</h1>

      <p class="subtitle">
        Give your clothes another life by listing them on ReWear.
      </p>


      <!-- IMAGE -->

      <div class="image-box">

        <div class="image-icon">
          📸
        </div>

        <p>
          Upload a clear photo of your clothing
        </p>

        <input
          type="file"
          id="image"
          accept="image/*">

      </div>


      <!-- AI -->

      <div class="ai-box">

        🤖 <strong>ReWear AI</strong>

        <p>
          AI clothing recognition and smart price recommendation
          can help you create your listing.
        </p>

      </div>


      <form id="upload-form">


        <!-- TITLE -->

        <div class="form-group">

          <label>
            Clothing Title
          </label>

          <input
            type="text"
            id="title"
            placeholder="Example: Blue Denim Jacket"
            required>

        </div>


        <!-- CATEGORY + CONDITION -->

      <!-- CATEGORY + GENDER -->

<div class="row">

  <div class="form-group">

    <label>
      Category
    </label>

    <select id="category" required>

      <option value="">
        Select category
      </option>

      <option value="T-Shirts">
        T-Shirts
      </option>

      <option value="Shirts">
        Shirts
      </option>

      <option value="Jeans">
        Jeans
      </option>

      <option value="Dresses">
        Dresses
      </option>

      <option value="Jackets">
        Jackets
      </option>

      <option value="Shoes">
        Shoes
      </option>

      <option value="Accessories">
        Accessories
      </option>

      <option value="Other">
        Other
      </option>

    </select>

  </div>


  <div class="form-group">

    <label>
      Gender
    </label>

    <select id="gender" required>

      <option value="">
        Select gender
      </option>

      <option value="Men">
        Men
      </option>

      <option value="Women">
        Women
      </option>

      <option value="Unisex">
        Unisex
      </option>

    </select>

  </div>

</div>


<!-- CONDITION -->

<div class="form-group">

  <label>
    Condition
  </label>

  <select id="condition" required>

    <option value="">
      Select condition
    </option>

    <option value="New">
      New
    </option>

    <option value="Like New">
      Like New
    </option>

    <option value="Good">
      Good
    </option>

    <option value="Fair">
      Fair
    </option>

  </select>

</div>


        <!-- PRICE + TYPE -->

        <div class="row">

          <div class="form-group">

            <label>
              Price (₹)
            </label>

            <input
              type="number"
              id="price"
              placeholder="Example: 499"
              min="0"
              required>

          </div>


          <div class="form-group">

            <label>
              Listing Type
            </label>

            <select id="listingType" required>

              <option value="Buy">
                Sell / Buy
              </option>

              <option value="Rent">
                Rent
              </option>

              <option value="Exchange">
                Exchange
              </option>

              <option value="Donate">
                Donate
              </option>

            </select>

          </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            id="description"
            placeholder="Describe the clothing, size, color, material, etc."
            required></textarea>

        </div>


        <button
          type="submit"
          class="submit-btn">

          List Clothing

        </button>


        <div
          class="message"
          id="message">
        </div>


      </form>

    </div>

  </div>


  <script>

    const form = document.getElementById("upload-form");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const title =
        document.getElementById("title").value;

     const category =
  document.getElementById("category").value;

const gender =
  document.getElementById("gender").value;

const condition =
  document.getElementById("condition").value;

      const price =
        document.getElementById("price").value;

      const listingType =
        document.getElementById("listingType").value;

      const description =
        document.getElementById("description").value;


      try {

        const formData = new FormData();

formData.append(
    "title",
    title
);

formData.append(
    "category",
    category
);

formData.append(
    "gender",
    gender
);

formData.append(
    "condition",
    condition
);

formData.append(
    "price",
    price
);

formData.append(
    "listingType",
    listingType
);

formData.append(
    "description",
    description
);


const imageFile =
    document.getElementById("image").files[0];


if (imageFile) {

    formData.append(
        "image",
        imageFile
    );

}


const response = await fetch(
    "/api/listings",
    {

        method: "POST",

        body: formData

    }
);


        const data = await response.json();

        const message =
          document.getElementById("message");


        if (response.ok) {

          message.textContent =
            "✅ Clothing listed successfully!";

          form.reset();

        } else {

          message.textContent =
            "❌ " + (data.message || "Could not create listing.");

        }

      }

      catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
          "❌ Could not connect to the server.";

      }

    });

  </script>


</body>

</html>
