<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Listings | ReWear AI</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3faf6;
      color: #173b2f;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #21865f;
    }

    .home-btn {
      text-decoration: none;
      color: #21865f;
      font-weight: bold;
      margin-right: 20px;
    }

    .sell-btn {
      text-decoration: none;
      background: #21865f;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .listings {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .clothing-icon {
      height: 150px;
      background: #e6f5ed;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 55px;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .price {
      color: #21865f;
      font-size: 21px;
      font-weight: bold;
      margin: 12px 0;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .tag {
      background: #e9f6ef;
      color: #21865f;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      background: white;
      border-radius: 16px;
      padding: 50px;
      text-align: center;
      color: #777;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }
    .clothing-image {
  height: 220px;
  background: #e6f5ed;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.clothing-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.clothing-image span {
  font-size: 60px;
}

.delete-btn {
  width: 100%;
  margin-top: 18px;
  padding: 11px;
  border: none;
  border-radius: 8px;
  background: #d9534f;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.delete-btn:hover {
  background: #c43f3b;
}

  </style>

</head>


<body>


<header>

  <div class="logo">
    ReWear AI
  </div>

  <div>

    <a href="index.html"
       class="home-btn">
      Home
    </a>

    <a href="upload.html"
       class="sell-btn">
      + Sell Item
    </a>

  </div>

</header>


<div class="container">

  <h1>My Listings 👕</h1>

  <p class="subtitle">
    Clothes you have listed on ReWear.
  </p>


  <div
    class="listings"
    id="listings">

    <div class="empty">

      <div class="empty-icon">
        ⏳
      </div>

      Loading your listings...

    </div>

  </div>

</div>


<script>

async function loadListings() {

  try {

    const response =
      await fetch("/api/my-listings");

    const data =
      await response.json();


    if (!data.loggedIn) {

      window.location.href =
        "login.html";

      return;

    }


    const container =
      document.getElementById("listings");


    if (data.listings.length === 0) {

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            👕
          </div>

          <h2>
            No listings yet
          </h2>

          <p>
            Sell your unused clothes and
            give them another life.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML =
      data.listings.map(item => `

        <div class="card">

          <div class="clothing-image">

  ${
    item.image

    ? `<img src="${item.image}" alt="${item.title}">`

    : `<span>👕</span>`
  }

</div>
          <h2>
            ${item.title}
          </h2>

          <div class="price">
            ₹${item.price}
          </div>

          <div class="tags">

            <span class="tag">
              ${item.category}
            </span>

            <span class="tag">
              ${item.gender}
            </span>

            <span class="tag">
              ${item.condition}
            </span>

            <span class="tag">
              ${item.listing_type}
            </span>

          </div>

          <button
  class="delete-btn"
  onclick="deleteListing(${item.id})">

  🗑️ Delete Listing

</button>

        </div>

      `).join("");

  }

  catch (error) {

    console.error(error);

    document.getElementById("listings").innerHTML = `

      <div class="empty">

        ❌ Could not load your listings.

      </div>

    `;

  }

}


loadListings();
async function deleteListing(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this listing?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/listings/" + id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (response.ok) {

            alert(
                "Listing deleted successfully."
            );

            loadListings();

        }

        else {

            alert(
                data.message ||
                "Could not delete listing."
            );

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not connect to the server."
        );

    }

}

</script>


</body>

</html>
